[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "autoposter"
version = "0.1.0"
description = "Automated Reddit-to-Instagram Reels content bot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "discord.py>=2.4.0",
    "praw>=7.7.0",
    "prawcore>=2.4.0",
    "playwright>=1.44.0",
    "edge-tts>=6.1.9",
    "anthropic>=0.30.0",
    "ffmpeg-python>=0.2.0",
    "Pillow>=10.3.0",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "tenacity>=8.3.0",
    "APScheduler>=3.10.4",
    "yt-dlp>=2024.5.0",
]

[project.scripts]
autoposter-bot  = "bot.discord_bot:main"
autoposter-test = "test_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*", "bot*", "utils*", "tools*"]
